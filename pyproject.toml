[project]
name = "podcast-forge-studio"
version = "1.0.0"
description = "Sistema local automatizado para convertir podcasts de cualquier duración en Shorts, vídeos medios y vídeos largos con IA editorial, EDL sin silencios/censura y subtítulos ASS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.5.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.3",
    "python-dotenv>=1.0.1",
    "openai>=1.50.0",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "faster-whisper>=1.1.0",
    "av>=11.0.0,<17.0.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "Pillow>=10.4.0",
    "watchdog>=5.0.0",
    "typer>=0.12.5",
    "rich>=13.9.0",
    "edge-tts>=7.0.0",
    "piper-tts>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
